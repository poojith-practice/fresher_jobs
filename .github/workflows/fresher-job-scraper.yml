name: Fresher job scrape

on:
  # 11:00 AM and 04:00 PM IST (POSIX cron in UTC: 05:30 and 10:30 UTC)
  # schedule:
  #   - cron: "30 5 * * *"
  #   - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Hours of job history to fetch (default: 24)"
        required: false
        type: string
        default: "24"
  repository_dispatch:

permissions:
  contents: write

concurrency:
  group: fresher-job-scraper
  # A new scheduled run must not be blocked by a stale runner status.
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_FILE: credentials.json
      GOOGLE_JOBS_WORKSHEET: Sheet1
      # LLM API Keys passed from GitHub Secrets (Rotating multi-key pool: OpenRouter primary, Groq fallback)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY1: ${{ secrets.OPENROUTER_API_KEY1 || secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY2: ${{ secrets.OPENROUTER_API_KEY2 || secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY3: ${{ secrets.OPENROUTER_API_KEY3 || secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY4: ${{ secrets.OPENROUTER_API_KEY4 || secrets.OPENROUTER_API_KEY_4 }}
      OPENROUTER_API_KEY5: ${{ secrets.OPENROUTER_API_KEY5 || secrets.OPENROUTER_API_KEY_5 }}
      OPENROUTER_API_KEY6: ${{ secrets.OPENROUTER_API_KEY6 || secrets.OPENROUTER_API_KEY_6 }}
      OPENROUTER_MODEL: "google/gemma-4-26b-a4b-it:free"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 || secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 || secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 || secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY4: ${{ secrets.GROQ_API_KEY4 || secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY5: ${{ secrets.GROQ_API_KEY5 || secrets.GROQ_API_KEY_5 }}
      GROQ_API_KEY6: ${{ secrets.GROQ_API_KEY6 || secrets.GROQ_API_KEY_6 }}
      GROQ_MODEL: "qwen/qwen3.8-27b"
      # RocketReach HR Recruiter Enrichment API Key
      ROCKETREACH_API_KEY: ${{ secrets.ROCKETREACH_API_KEY || '1cfb3c5k109696672f1c5538929215d9ef473989' }}
      # Google Drive Upload Integration
      GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL || 'https://script.google.com/macros/s/AKfycbxdnDqgef2bf570oe13cmFtZg819lmv8NQNQqyYky_-jhJFPq_WRHS0zOUmMVKts8Zlsg/exec' }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '10VvfeWYKf0fTVuihc8nWYSpeipVZwSiz' }}
      # LinkedIn-only rotating proxy pool (Scenario A)
      JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
      MAX_LINKEDIN_REQUESTS: "250"
      # Brevo Student Job Alert Automation
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID || '477' }}
      BREVO_TEMPLATE_ID: ${{ secrets.BREVO_TEMPLATE_ID || '379' }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL || 'sandeepjethani4@gmail.com' }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME || 'Quantum Learnings' }}

    steps:
      - name: Verify Google Sheets secrets are configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_SPREADSHEET_ID" || { echo "Missing repository secret: GOOGLE_SPREADSHEET_ID"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing repository secret: GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache interview prep documents
        uses: actions/cache@v4
        with:
          path: output/interview_docs
          key: interview-docs-${{ github.run_id }}
          restore-keys: |
            interview-docs-

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium || true
          else
            python -m playwright install-deps chromium || true
          fi

      - name: Create Google service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          key = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          parsed = json.loads(key)
          if parsed.get("type") != "service_account":
              raise SystemExit("GOOGLE_SERVICE_ACCOUNT_JSON must be a service-account JSON key")
          Path("credentials.json").write_text(key, encoding="utf-8")
          PY

      - name: Run fresher job scraper pipeline
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u main.py --hours "${{ inputs.lookback_hours || '24' }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python -u main.py --hours "${{ github.event.client_payload.lookback_hours || '24' }}"
          else
            python -u main.py --hours 48
          fi

      # This public repository's schedule can be disabled after 60 days without
      # repository activity. Record each successful run to keep it active.
      - name: Record successful run
        if: success()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-successful-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-successful-run.txt
          git commit -m "Record successful scraper run"
          git pull --rebase origin main
          git push

      - name: Upload scraper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresher-jobs-run-${{ github.run_id }}
          path: |
            output/
            run_report.json
            run_report.md
            canonical_jobs_latest.json
